name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # `bun run lint` includes import/no-unresolved (via eslint-plugin-import),
      # which fails on imports that don't resolve — e.g. stale relative paths
      # left behind after moving a file or folder.
      - name: Lint (incl. import resolution)
        run: bun run lint

      # tsc -b + vite build; also surfaces TS2307 for unresolved modules.
      - name: Build
        run: bun run build
